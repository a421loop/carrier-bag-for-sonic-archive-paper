<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="config.js"></script></head><body>
<title>Carrier Bag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500&display=swap">
<style>
/* One screen of pale paper. A basket of sand along the bottom; each recording is a pixel flower.
   Single look on purpose. Colors: pale pink paper, plum #741b47 + yellow #f1c232 blooms, sand. */
:root{
  --paper:#f2e6e6;
  --ink:#4c1130;          /* deep plum, for the little text there is */
  --burgundy:#741b47;
  --blue:#f1c232;
  --soft:#a58c90;
  --f-pix:"Pixelify Sans","Courier New",monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-pix);font-size:16px;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--burgundy);outline-offset:2px}
#cv{position:fixed;left:0;top:0;image-rendering:pixelated;touch-action:pan-y}
.edge{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:4;background:var(--paper);border:2px solid var(--ink);color:var(--ink);padding:0 6px;font-size:18px;line-height:1.2}
#edgeL{left:max(12px,env(safe-area-inset-left,0px))} #edgeR{right:max(12px,env(safe-area-inset-right,0px))}
html,body,button,label,.tab,#cv,#cv.over{cursor:var(--bee,auto)}
input[type=text],input[type=email],textarea{cursor:text}

.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-block:calc(10px + env(safe-area-inset-top,0px)) 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bags{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:baseline;min-width:0}
.tab{background:none;border:0;padding:0;cursor:pointer;color:var(--soft);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .two{color:var(--burgundy);margin-left:4px}
.right{display:flex;gap:10px;align-items:center;flex:none}
.dot{width:20px;height:20px;border:2px solid var(--ink);overflow:hidden;background:var(--paper)}
.dot img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.dot.empty{border-style:dashed;border-color:var(--soft)}
.add{cursor:pointer;color:var(--ink);border:2px solid var(--ink);padding:1px 8px;background:var(--paper);box-shadow:none}
.add:hover{box-shadow:3px 3px 0 var(--blue)}
.add input{display:none}
.add.busy{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}

.label{position:fixed;z-index:4;transform:translate(-50%,-100%);color:var(--burgundy);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;
  background:var(--paper);padding:0 4px}
.hint{position:fixed;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--soft);pointer-events:none;z-index:3}
.words{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);color:var(--burgundy);text-align:center;
  max-width:min(520px,calc(100% - 32px));pointer-events:none;z-index:6;background:var(--paper);padding:2px 8px}

.card{position:fixed;z-index:10;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--burgundy);padding:10px 12px;
  display:flex;flex-direction:column;gap:8px;width:250px}
.card input[type=email],.card input[type=text]{background:#fff8;border:0;border-bottom:2px solid var(--ink);padding:2px 4px;width:100%;font-size:18px}
.card .row{display:flex;gap:6px 14px;flex-wrap:wrap}
.card button{background:none;border:0;padding:0;cursor:pointer;border-bottom:2px solid #4c113044}
.card button.on{border-bottom-color:var(--burgundy);color:var(--burgundy)}
.card .bye{color:var(--burgundy);border-color:transparent}
.card .soft{font-size:14px;color:var(--soft)}
.testbtn{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--paper);border:2px dashed var(--soft);color:var(--soft);cursor:pointer;padding:0 6px;font-size:14px}
.testbtn.on{border-style:solid;border-color:var(--burgundy);color:var(--burgundy)}
.test{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));z-index:9;width:min(290px,calc(100% - 24px));background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--blue);padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.test label{display:flex;gap:8px;align-items:center;cursor:pointer}
.test input[type=range]{width:100%;accent-color:var(--burgundy)}
.test .soft{color:var(--soft);font-size:13px}
.all{cursor:pointer;color:var(--ink);border:2px solid var(--ink);padding:1px 8px;background:var(--paper);box-shadow:3px 3px 0 var(--burgundy)}
.all.on{background:var(--burgundy);color:var(--paper)}
/* the drawing pad */
.card.pad{left:50%!important;top:50%!important;transform:translate(-50%,-50%);width:min(300px,calc(100vw - 32px))}
.card.pad .step{font-size:13px;color:var(--soft)}
#padCv{width:100%;aspect-ratio:1;image-rendering:pixelated;border:2px solid var(--ink);background:#fff8;touch-action:none;cursor:crosshair}
.sw{display:flex;gap:4px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border:2px solid transparent!important;padding:0;cursor:pointer}
.sw button[aria-pressed="true"]{border-color:var(--ink)!important;outline:2px solid var(--paper);outline-offset:-4px}
.sw .eraser{background:repeating-linear-gradient(45deg,#fff 0 4px,#e6d6d6 4px 8px)}
.card button.go{background:var(--burgundy);color:var(--paper);padding:1px 10px;border:0}
.choose{display:flex;gap:10px}
.choose button,.choose label{flex:1;text-align:center;border:2px solid var(--ink)!important;padding:10px 4px!important;cursor:var(--bee,pointer);background:var(--paper)}
.choose button:hover,.choose label:hover{box-shadow:3px 3px 0 var(--blue)}
.choose input{display:none}
.rec{display:flex;align-items:center;gap:14px}
.recbtn{width:56px;height:56px;border:3px solid var(--ink)!important;background:var(--paper)!important;display:grid;place-items:center;padding:0!important}
.recbtn i{display:block;width:26px;height:26px;background:var(--burgundy);border-radius:50%}
.recbtn.on i{border-radius:0;width:22px;height:22px;animation:blink 1s steps(2) infinite}
#recT{font-size:22px;font-variant-numeric:tabular-nums}
/* pollen cards: plain pixel boxes */
.card.os{width:auto;padding:12px;position:fixed}
.tiles{display:flex;gap:8px}
.tile{width:62px;height:62px;display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:2px solid var(--ink)!important;background:var(--paper);font-size:13px;padding:0!important;color:var(--ink)}
.tile:hover,.tile:focus-visible{box-shadow:3px 3px 0 var(--blue);transform:translate(-1px,-1px)}
.tile input{display:none}
.tile svg{width:24px;height:24px;image-rendering:pixelated}
.tile.icon svg{width:28px;height:28px}
.add.walk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.add.walk svg{width:12px;height:14px;image-rendering:pixelated;flex:none}
.xbtn{position:absolute;right:6px;top:6px;width:24px;height:24px;border:0!important;background:none!important;font-size:16px;line-height:24px;padding:0!important;text-align:center;color:var(--ink)}
.xbtn:hover{color:var(--burgundy)}
.card:has(> .xbtn){padding-top:32px}
.card.view{padding:10px;gap:8px;width:min(420px,calc(100vw - 32px))}
.card.view.wordcard{width:260px}
.view img,.view video{display:block;width:100%;max-height:60vh;object-fit:contain;border:2px solid var(--ink);image-rendering:auto;background:#fff8}
.view textarea,.view .words-in{width:100%;min-height:110px;border:0;padding:0 2px;background:repeating-linear-gradient(transparent 0 23px,#5a223026 23px 24px);line-height:24px;font:inherit;font-size:17px;color:var(--ink);resize:none;white-space:pre-wrap;word-break:break-word}
.view textarea:focus{outline:none}
.view .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--soft)}
.view .foot button{font-size:13px}
/* the share box */
.card.share{left:50%!important;top:50%!important;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 32px));gap:12px;padding:14px}
.sh-title{font-size:18px;padding-right:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-opts{display:flex;flex-direction:column;gap:4px}
.sh-opt{display:flex!important;gap:10px;align-items:flex-start;text-align:left;padding:6px!important;border:2px solid transparent!important}
.sh-opt:hover{border-color:#5a223033!important}
.sh-opt[aria-checked="true"]{border-color:var(--ink)!important;box-shadow:3px 3px 0 var(--blue)}
.sh-opt i{flex:none;width:14px;height:14px;border:2px solid var(--ink);margin-top:3px;background:var(--paper)}
.sh-opt[aria-checked="true"] i{background:var(--burgundy);box-shadow:inset 0 0 0 2px var(--paper)}
.sh-opt span{display:flex;flex-direction:column}
.sh-opt b{font-weight:500}
.sh-opt small{font-size:13px;color:var(--soft)}
.sh-link{display:flex;gap:6px}
.sh-link input{flex:1;font-size:13px!important;color:var(--soft)}
.sh-link.off{opacity:.5}
.sh-note{font-size:13px}
/* the garden: every patch as a seed tray */
.garden{position:fixed;inset:0;overflow-y:auto;z-index:3;background:var(--paper);
  padding-block:calc(70px + env(safe-area-inset-top,0px)) 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.trays{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:30px 26px;max-width:1200px;margin:0 auto}
.tray{display:flex;flex-direction:column;gap:10px;background:none;border:0;padding:0;text-align:center;color:var(--ink)}
.tray{position:relative;cursor:var(--bee,pointer)}
.drawedge{background:none;border:0;padding:0;font:inherit;font-size:12px;color:var(--burgundy);text-decoration:underline;cursor:var(--bee,pointer)}
.tray canvas{width:100%;aspect-ratio:100/64;image-rendering:pixelated;transition:transform .15s}
.tray:hover canvas,.tray:focus-visible canvas{transform:translate(-2px,-2px)}
.tray span{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray small{display:block;font-size:12px;color:var(--soft);margin-top:-6px}
.tray .plus{position:absolute;left:0;right:0;top:calc((100% - 40px) * .6);font-size:28px;font-weight:400;color:var(--soft);pointer-events:none}
.tray.new:hover .plus{color:var(--ink)}
.card.dig{width:min(420px,calc(100vw - 32px))}
#digCv{width:100%;aspect-ratio:100/64;image-rendering:pixelated;background:#fff6;border:2px dashed #a58c90;touch-action:none;cursor:crosshair}
.card button.go:disabled{opacity:.4}
.gtitle{font-size:20px}
.tab.back{color:var(--ink)}
.bags{align-items:center!important}
.tab.ptab{display:inline-grid;place-items:center;border:0!important;padding:0;color:var(--ink);text-shadow:none}
.tab.ptab canvas{grid-area:1/1;image-rendering:pixelated;display:block}
.tab.ptab > .pin{grid-area:1/1;display:flex;align-items:center;gap:6px;white-space:nowrap;padding:0 10px 3px 22px;position:relative}
.tab.ptab .tclose{display:grid;place-items:center;width:22px;height:22px;font-size:17px;line-height:1;color:var(--ink);opacity:.6;border-radius:0}
.tab.ptab .tclose:hover{opacity:1;background:#a58c9033}
.tab.ptab:hover canvas{transform:translateY(-1px)}
.bags{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none}
.ptab-wrap{display:inline-flex;align-items:center;flex:none;opacity:.5;transition:opacity .15s}
.ptab-wrap.on,.ptab-wrap:hover{opacity:1}
</style>

<canvas id="cv" aria-label="Carrier bag of recordings"></canvas>
<div class="top">
  <nav class="bags" id="bags" aria-label="Patches"></nav>
  <div class="right"><div class="right" id="here" aria-label="Who is here"></div>
    <button class="add" id="add" hidden>+ add</button>
    <button class="add walk" id="walk" hidden title="walk: listen to the landscape, oldest planted first" aria-label="Walk through the landscape"></button>
    <button class="add" id="share" hidden>share</button></div>
</div>
<main class="garden" id="garden" hidden aria-label="Garden"></main>

</div>

<script>
/* Carrier bag
   Each recording is a pixel flower in a basket of sand.
   - Tap it: the recording plays and the flower grows, pixel by pixel.
   - Leave it: after 3 days it starts to wither; petals fall into the sand.
   - Most played = tallest.
   - A basket you share only plays when two people are here, and a tap plays for both.
   Storage: inside this artifact (db = baskets, assets = audio, room = who's here).
   Opened as a plain file it keeps things in this browser only. */

const DAY = 864e5, now = () => Date.now();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 12) : Math.random().toString(36).slice(2, 14));
function hash(s){ let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let s = hash(seed) || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }

/* =================== storage backends (same shape for both) =================== */
const PIECE = 19 * 1024 * 1024, joined = new Map();
function cloudBackend(db, assets, user, me){
  let mine = {}, shared = {}, onChange = () => {};
  const emit = () => onChange({ ...mine, ...shared });
  const ref = b => b.shared ? db.doc('bags/' + b.id) : db.doc(`data/users/${me}/${b.id}`);
  return {
    kind: 'cloud', canAdd: !!assets,
    start(cb){
      onChange = cb;
      let answered = 0; const done = () => { if (++answered === 2) clearTimeout(slow); };
      const slow = setTimeout(() => say('can’t reach your garden yet…'), 10000);
      db.collection('data/users/' + me).onSnapshot(s => { mine = {}; s.docs.forEach(d => mine[d.id] = { ...structuredClone(d.data()), id: d.id, shared: false }); if (!s.metadata.fromCache) done(); emit(); }, () => done());
      db.collection('bags').onSnapshot(s => { shared = {}; s.docs.forEach(d => shared[d.id] = { ...structuredClone(d.data()), id: d.id, shared: true }); if (!s.metadata.fromCache) done(); emit(); }, () => done());
    },
    async createBag(name){ const b = { id: uid(), name, created: now(), owner: me, flowers: {} }; await ref({ ...b, shared: false }).set(b); return b.id; },
    rename: (b, name) => ref(b).update({ name }),
    async setShared(b, on){
      const body = { name: b.name, created: b.created, owner: b.owner || me, flowers: b.flowers || {}, access: b.access || 'together' };
      await ref({ ...b, shared: on }).set(body); await ref(b).delete();
    },
    async setAccess(b, access){   // 'private' | 'together' | 'listen' | 'tend'
      if (access === 'private') { if (b.shared) await this.setShared(b, false); return; }
      if (!b.shared) { b.access = access; await this.setShared(b, true); }
      else await ref(b).update({ access });
    },
    async deleteBag(b){ if (assets) for (const f of Object.values(b.flowers || {})) for (const id of [f, ...(f.notes || [])].flatMap(o => [o.asset, ...(o.parts || [])]).filter(Boolean)) await assets.delete(id).catch(() => {}); await ref(b).delete(); },
    addFlower: (b, f) => ref(b).update({ flowers: { [f.id]: f } }),
    patchFlower: (b, fid, p) => ref(b).update({ flowers: { [fid]: p } }),
    patchMany: (b, m) => ref(b).update({ flowers: m }),
    async removeFlower(b, fid){
      const f = b.flowers[fid], rest = { ...b.flowers }; delete rest[fid];
      await ref(b).set({ name: b.name, created: b.created, owner: b.owner || me, flowers: rest });
      if (assets && f) [f, ...(f.notes || [])].flatMap(o => [o.asset, ...(o.parts || [])]).filter(Boolean).forEach(id => assets.delete(id).catch(() => {}));
    },
    dropAudio(o){ if (assets && o) [o.asset, ...(o.parts || [])].filter(Boolean).forEach(id => assets.delete(id).catch(() => {})); },
    /* storage takes one file up to 20 MB, so a longer recording goes up in pieces
       (each piece starts with one marker byte) and is joined again when it plays */
    async putAudio(file, fid, progress){
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      const type = /^image\/(png|jpeg|gif|webp)$/.test(file.type) ? file.type : ['webm', 'ogg', 'opus', 'oga'].includes(ext) || /webm|ogg|opus/.test(file.type) ? 'video/webm' : 'video/mp4';
      if (file.size <= PIECE) return { asset: (await assets.upload(file, { type })).id };
      const parts = [], n = Math.ceil(file.size / PIECE);
      try {
        for (let i = 0; i < n; i++) {
          progress?.(i + 1, n);
          const piece = new Blob([new Uint8Array([0]), file.slice(i * PIECE, (i + 1) * PIECE)], { type: 'video/mp4' });
          parts.push((await assets.upload(piece, { type: 'video/mp4' })).id);
        }
      } catch (e) { parts.forEach(id => assets.delete(id).catch(() => {})); throw e; }
      return { parts, mime: file.type || 'audio/mp4' };
    },
    async audioSrc(f){
      if (f.asset) return '/_blob/' + f.asset;
      if (!f.parts?.length) return null;
      if (joined.has(f.id)) return joined.get(f.id);
      const bufs = await Promise.all(f.parts.map(id => fetch('/_blob/' + id).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })));
      const url = URL.createObjectURL(new Blob(bufs.map(b => b.slice(1)), { type: f.mime || 'audio/mp4' }));
      joined.set(f.id, url); return url;
    },
  };
}
function localBackend(){
  let dbp; const open = () => dbp ||= new Promise((res, rej) => { try { const r = indexedDB.open('carrier-bag-2', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('audio'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
  const q = (st, m, fn) => open().then(db => new Promise((res, rej) => { const r = fn(db.transaction(st, m).objectStore(st)); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const mem = new Map(); let bags = {}, cb = () => {};
  const save = () => { q('kv', 'readwrite', o => o.put(bags, 'bags')).catch(() => {}); cb(JSON.parse(JSON.stringify(bags))); };
  return {
    kind: 'local', canAdd: true,
    async start(c){ cb = c; bags = (await q('kv', 'readonly', o => o.get('bags')).catch(() => null)) || {}; cb(JSON.parse(JSON.stringify(bags))); },
    async createBag(name){ const id = uid(); bags[id] = { id, name, created: now(), shared: false, flowers: {} }; save(); return id; },
    rename(b, name){ bags[b.id].name = name; save(); },
    setShared(){},
    setAccess(){},
    deleteBag(b){ delete bags[b.id]; save(); },
    addFlower(b, f){ bags[b.id].flowers[f.id] = f; save(); },
    patchFlower(b, fid, p){ Object.assign(bags[b.id].flowers[fid], p); save(); },
    patchMany(b, m){ for (const k in m) Object.assign(bags[b.id].flowers[k], m[k]); save(); },
    removeFlower(b, fid){ (bags[b.id].flowers[fid]?.notes || []).forEach(n => q('audio', 'readwrite', o => o.delete(n.id)).catch(() => {})); delete bags[b.id].flowers[fid]; q('audio', 'readwrite', o => o.delete(fid)).catch(() => {}); save(); },
    dropAudio(n){ mem.delete(n.id); q('audio', 'readwrite', o => o.delete(n.id)).catch(() => {}); },
    async putAudio(file, fid){ mem.set(fid, file); await q('audio', 'readwrite', o => o.put(file, fid)).catch(() => {}); return {}; },
    async audioSrc(f){ const blob = mem.get(f.id) || await q('audio', 'readonly', o => o.get(f.id)).catch(() => null); return blob ? URL.createObjectURL(blob) : null; },
  };
}


/* ---------- your own site: Supabase (used when config.js has your project's URL and key) ---------- */
function supabaseBackend(sb, me){
  let onChange = () => {}, timer = null;
  const fromRow = r => ({ id: r.id, name: r.name, created: Number(r.created), shared: r.shared, access: r.access || 'together', owner: r.owner, flowers: r.flowers || {} });
  const load = async () => {
    const { data, error } = await sb.from('bags').select('*');
    if (error) { say('can’t reach your garden · ' + error.message); return; }
    onChange(Object.fromEntries(data.map(r => [r.id, fromRow(r)])));
  };
  const reload = () => { clearTimeout(timer); timer = setTimeout(load, 120); };
  const must = async q => { const { error } = await q; if (error) throw error; };
  const del = paths => paths.length && sb.storage.from('audio').remove(paths).catch(() => {});

/* who's here + play/stop for a shared basket, over Supabase Realtime, shaped like the artifact's room */
function supabaseRoom(sb, me, myName){
  const tab = uid();
  return { async join(name){
    const ch = sb.channel(name, { config: { presence: { key: tab }, broadcast: { self: true } } });
    const peerFns = [], topics = {};
    let list = [];
    ch.on('presence', { event: 'sync' }, () => {
      list = Object.entries(ch.presenceState()).map(([k, arr]) => ({ kind: 'viewer', peer: k, by: arr[0]?.user || null, name: arr[0]?.name || '', isMe: arr[0]?.user === me, sameTab: k === tab }));
      peerFns.forEach(fn => fn({ peers: list }));
    });
    ch.on('broadcast', { event: '*' }, m => (topics[m.event] || []).forEach(fn => fn({ topic: m.event, data: m.payload })));
    await new Promise((res, rej) => ch.subscribe(st => { if (st === 'SUBSCRIBED') { ch.track({ user: me, name: myName }); res(); } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') rej(st); }));
    return {
      peers: () => list,
      onPeers: fn => { peerFns.push(fn); return () => {}; },
      on: (t, fn) => { (topics[t] ||= []).push(fn); return () => {}; },
      emit: (t, data) => ch.send({ type: 'broadcast', event: t, payload: data }),
      leave: () => sb.removeChannel(ch),
    };
  } };
}

/* every flower keeps a little room of its own; if they don't all fit, the bed grows longer than the screen and you scroll it */
const SPACE = 11, pos = new Map();

/* blossoms: a grid of palette digits ('.' = empty). Drawn by you (f.draw), or made from a pattern. */
function colorsOf(f){

/* =================== adding recordings =================== */
function openSpot(b){
  const xs = flowersOf(b).map(f => f.x).sort((a, c) => a - c);
  if (!xs.length) return .3 + Math.random() * .4;
  const spots = [{ at: xs[0] / 2, room: xs[0] }, { at: (xs[xs.length - 1] + 1) / 2, room: 1 - xs[xs.length - 1] }];   // the two ends
  for (let i = 1; i < xs.length; i++) spots.push({ at: (xs[i] + xs[i - 1]) / 2, room: (xs[i] - xs[i - 1]) / 2 });       // between neighbours
  const best = spots.sort((a, c) => c.room - a.room)[0];
  return clamp(best.at + (Math.random() - .5) * best.room * .5, 0, 1);   // not quite even: no order to it
}
function leastUsedColors(b){
  const n = PAIRS.map(() => 0); flowersOf(b).forEach(f => { const i = PAIRS.findIndex(p => p.join() === colorsOf(f).join()); if (i >= 0) n[i]++; });
  const min = Math.min(...n), opts = n.map((v, i) => v === min ? i : -1).filter(i => i >= 0);
  return PAIRS[opts[Math.floor(Math.random() * opts.length)]];
}
async function addFiles(files){
  const b = cur(); if (!b) return;
  files = files.filter(f => f.type.startsWith('audio/') || f.type.startsWith('video/') || /\.(m4a|mp3|wav|ogg|aac|flac|webm|opus|mp4)$/i.test(f.name));
  if (!files.length) return;
  // 1. draw (or keep) a blossom for each recording
  const plan = []; let rest = false;
  for (const [i, file] of files.entries()) {
    const color = leastUsedColors({ flowers: Object.fromEntries([...flowersOf(b), ...plan].map(f => [f.id, f])) });
    const f = { id: uid(), name: '', file: file.name, color, plays: 0, lastPlayed: now(), added: now() + i, by: me };
    if (!rest) {
      const res = await drawPad({ name: f.name, grid: centerGrid(patternGrid(HEADS[0], color)), step: files.length > 1 ? `${i + 1} of ${files.length}` : '', more: files.length - i - 1 });
      if (!res) { if (!plan.length) return; break; }       // closed: plant what's drawn so far
      f.name = res.name || ''; if (res.draw) f.draw = res.draw; rest = res.rest;
    }
    plan.push({ ...f, file });
  }
  // 2. plant them
  $('#add').classList.add('busy');
  let done = 0, failed = [];
  for (const [i, p] of plan.entries()) {
    const { file, ...f } = p; f.x = openSpot(b);
    const tag = plan.length > 1 ? `${i + 1} of ${plan.length}` : '';
    say(`planting ${tag} …`, true);
    try {
      Object.assign(f, await store.putAudio(file, f.id, (k, n) => say(`planting ${tag} · big file, piece ${k} of ${n} …`, true)));
      b.flowers = { ...(b.flowers || {}), [f.id]: f };
      await store.addFlower(b, f); done++; pan.to = f.id;
      render();
    } catch (e) { failed.push(`${file.name}${e?.code === 'quota_or_state' ? ' (storage is full)' : e?.code === 'unsupported_type' ? ' (try it as .m4a)' : ''}`); }
  }
  $('#add').classList.remove('busy'); render();
  say(failed.length ? `planted ${done} · couldn’t add: ${failed.join(', ')}` : `planted ${done} ${done === 1 ? 'flower' : 'flowers'}`, false, failed.length ? 9000 : 2800);
}

/* the drawing pad: 9×9 pixels. Starts with a blossom so you can keep it, change it, or wipe it and draw your own. */
const PAD = 9;

  const steps = [];

      } else {

/* a pixel bee for the cursor (16×16, drawn at 2× = 32px), head on the left: that's where you point */
(function(){
  const BEE = [
    '................',
    '......WW..WW....',
    '.....WWWW.WWWW..',
    '.....WWWW.WWWW..',
    '......WW...WW...',
    '...KKKKKKKKKK...',
    '..KYYPYYPYYPYK..',
    '.KYEYPYYPYYPYYK.',
    '.KYYYPYYPYYPYYKK',
    '.KYYYPYYPYYPYYK.',
    '..KYYPYYPYYPYK..',
    '...KKKKKKKKKK...',
    '................', '................', '................', '................'];
  const C = { K: '#2b1a1f', Y: '#f1c232', P: '#741b47', W: '#dff0ff', E: '#2b1a1f' };
  let rects = '';
  BEE.forEach((row, y) => [...row].forEach((ch, x) => { if (C[ch]) rects += `<rect x="${x * 2}" y="${y * 2}" width="2" height="2" fill="${C[ch]}"${ch === 'W' ? ' fill-opacity=".85"' : ''}/>`; }));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" shape-rendering="crispEdges">${rects}</svg>`;

})();

/* a soft buzz while the bee flies: louder and a little higher the faster you move, gone when you stop */
const buzz = { ctx: null, gain: null, osc: [], last: null, on: true };
function startBuzz(){
  if (buzz.ctx) return;
  try {
    const ctx = buzz.ctx = new (window.AudioContext || window.webkitAudioContext)();
    const out = buzz.gain = ctx.createGain(); out.gain.value = 0; out.connect(ctx.destination);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(out);
    const wing = ctx.createGain(); wing.gain.value = .6; wing.connect(lp);                 // wing-beat flutter
    const lfo = ctx.createOscillator(), depth = ctx.createGain(); lfo.frequency.value = 38; depth.gain.value = .4;
    lfo.connect(depth); depth.connect(wing.gain); lfo.start();
    [[205, 'sawtooth'], [211, 'sawtooth'], [410, 'triangle']].forEach(([f, type]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; o.connect(wing); o.start(); buzz.osc.push({ o, f });
    });
  } catch { buzz.ctx = null; }
}
document.addEventListener('pointerdown', () => { if (buzz.on) { startBuzz(); buzz.ctx?.resume?.(); } }, true);   // browsers need a tap before any sound
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || !buzz.on || !buzz.ctx) return;
  const t = performance.now(), l = buzz.last; buzz.last = { x: e.clientX, y: e.clientY, t };
  if (!l || t - l.t > 200) return;
  const speed = Math.hypot(e.clientX - l.x, e.clientY - l.y) / Math.max(1, t - l.t);   // px per ms
  const k = clamp(speed / 2.2, 0, 1), at = buzz.ctx.currentTime;
  buzz.gain.gain.setTargetAtTime(.035 * k, at, .05);
  buzz.osc.forEach(({ o, f }) => o.frequency.setTargetAtTime(f * (1 + .25 * k), at, .08));
  clearTimeout(buzz.quiet); buzz.quiet = setTimeout(() => buzz.gain.gain.setTargetAtTime(0, buzz.ctx.currentTime, .12), 90);
});
document.addEventListener('pointerleave', () => buzz.gain?.gain.setTargetAtTime(0, buzz.ctx.currentTime, .1));
$('#buzz').addEventListener('change', e => {
  buzz.on = e.target.checked;
  try { localStorage.setItem('carrier-buzz', buzz.on ? '1' : '0'); } catch {}
  if (!buzz.on && buzz.gain) buzz.gain.gain.setTargetAtTime(0, buzz.ctx.currentTime, .05);
});
try { if (localStorage.getItem('carrier-buzz') === '0') { buzz.on = false; $('#buzz').checked = false; } } catch {}

/* =================== start =================== */
addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
(async () => {
  const CFG = window.CARRIER_CONFIG || {};
  let assets = null;
  if (CFG.supabaseUrl && CFG.supabaseKey && !/PASTE/.test(CFG.supabaseUrl + CFG.supabaseKey)) {
    // your own site
    try { await loadScript('vendor/supabase.js'); } catch { say('couldn’t load vendor/supabase.js'); return; }
    const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
    // no sign-in screen: each browser quietly gets its own private id (Supabase "anonymous sign-in")
    let { data: { session } } = await sb.auth.getSession();
    if (!session) {
      const { data, error } = await sb.auth.signInAnonymously();
      if (error) { say('turn on “Allow anonymous sign-ins” in Supabase → Authentication · ' + error.message, true); return; }
      session = data.session;
    }
    me = session.user.id;
    store = supabaseBackend(sb, me); room = supabaseRoom(sb, me, (session.user.email || '').split('@')[0]);
    canUpload = true; canEdit = true; assets = true;
  } else {
    const cl = window.claude?.use ? window.claude : null;
    const [db, as, u, rm] = cl ? await Promise.all(['db', 'assets', 'user', 'room'].map(n => cl.use(n).catch(() => null))) : [null, null, null, null];
    assets = as; userNS = u; room = rm; me = u ? await u.id() : null;
    if (db && me) { store = cloudBackend(db, assets, u, me); store.shares = true; canUpload = !!assets; canEdit = await u.canEdit(); }
    else {
      store = localBackend(); canUpload = true; canEdit = true;
      // on a real website this means config.js isn't filled in: say so instead of quietly hiding sharing
      if (/^https?:$/.test(location.protocol) && !cl) say(CFG.supabaseUrl ? 'not connected: config.js still has the PASTE text · saving in this browser only, no sharing' : 'not connected: config.js is missing · saving in this browser only, no sharing', true);
    }
  }
  let first = true;
  store.start(async next => {
    bags = next;
    if (first) { first = false; const want = (location.hash.match(/^#b-([A-Za-z0-9]+)/) || [])[1];
      if (want && bags[want]) { curId = want; view = 'patch'; } else view = 'garden'; }
    if (!Object.keys(bags).length && (store.kind === 'local' || assets) && !startedEmpty) { startedEmpty = true; await store.createBag('my sound archive'); return; }
    if (view === 'patch' && (!curId || !bags[curId])) { view = 'garden'; curId = null; }
    render(); if (view === 'patch') joinRoomFor(cur());
  });
})();
addEventListener('hashchange', () => { if (location.hash === '#garden') return view !== 'garden' && goGarden(); const id = (location.hash.match(/^#b-([A-Za-z0-9]+)/) || [])[1]; if (id && bags[id]) go(id); });
